name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pypdfium2

      # Regenerate datasets from the source PDFs and fail if the committed
      # datasets differ. This keeps the JSON provably derived from the PDFs.
      - run: python3 tools/pdf-ingest/ingest.py
      - run: python3 tools/pdf-ingest/validate.py
      - name: Check datasets are up to date
        run: git diff --exit-code -- packages/standards-data/datasets
